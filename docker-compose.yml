services:
  postgres:
    image: postgres:16-alpine
    container_name: carbovira-postgres
    environment:
      POSTGRES_DB: carbovira
      POSTGRES_USER: carbovira
      POSTGRES_PASSWORD: carbovira
    ports:
      # 5432 bu makinede başka bir projenin (blog-postgres) container'ı tarafından tutulu,
      # o yüzden host tarafında 5433 kullanıyoruz; container içi hâlâ standart 5432.
      - "5433:5432"
    volumes:
      - carbovira-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbovira"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carbovira-data:
