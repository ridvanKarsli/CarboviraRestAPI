plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jvm-test-suite'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CarboviraRestAPI'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion = '1.6.3'
    jjwtVersion = '0.12.6'
    testcontainersVersion = '1.21.4'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // webmvc starter Jackson'ı otomatik getirmiyor, ObjectMapper bean'i olmadan context patlıyordu
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Şema versiyonlama (Flyway) — ddl-auto yerine kontrollü migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Entity <-> DTO eşleme
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// e2eTest: gerçek bir Postgres'e (Testcontainers, Docker gerektirir) karşı gerçek HTTP
// istekleriyle tam kullanıcı akışlarını doğrular. test task'ından kasıtlı olarak ayrı —
// lokal makinede Docker açık olmadan da ./gradlew build çalışabilsin diye. CI'da ayrı
// bir adımda çalıştırılıyor (bkz. .github/workflows/ci.yml).
testing {
    suites {
        e2eTest(JvmTestSuite) {
            useJUnitJupiter()

            dependencies {
                implementation project()
                implementation 'org.springframework.boot:spring-boot-starter-actuator-test'
                implementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
                implementation 'org.springframework.boot:spring-boot-starter-security-test'
                implementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
                // TestRestTemplate Boot 4'te ayrı bir modüle taşınmış (eski org.springframework.boot.test.web.client
                // paketi artık yok) — jar'ı ~/.gradle cache'inde grep'leyip bulduk.
                implementation 'org.springframework.boot:spring-boot-resttestclient'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                // io.spring.dependency-management versiyonsuz bağımlılıkları illa kendi BOM'undan
                // yönetmeye çalışıyor ve testcontainers-bom platform importunu görmezden geliyor —
                // bu yüzden testcontainers modüllerini burada açıkça versiyonluyoruz.
                implementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
                implementation "org.testcontainers:postgresql:${testcontainersVersion}"
                implementation 'org.assertj:assertj-core'
                implementation 'org.junit.jupiter:junit-jupiter'
                runtimeOnly 'org.junit.platform:junit-platform-launcher'
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                    }
                }
            }
        }
    }
}
