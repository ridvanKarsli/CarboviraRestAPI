# Testler gercek bir Postgres/Docker gerektirmeden, bellek ici H2 ile calisir.
spring.datasource.url=jdbc:h2:mem:carbovira;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.jwt.secret=test-only-secret-key-do-not-use-in-production-1234567890
app.jwt.expiration-ms=3600000
