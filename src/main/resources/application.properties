spring.application.name=CarboviraRestAPI
server.port=${SERVER_PORT:8080}

# --- Veritabani (docker-compose.yml ile ayni varsayilanlar) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carbovira}
spring.datasource.username=${DB_USERNAME:carbovira}
spring.datasource.password=${DB_PASSWORD:carbovira}

# Semayi Hibernate degil Flyway yonetir; ddl-auto=validate sadece uyusmazlik varsa uyarir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET:local-dev-only-please-change-this-secret-before-production-usage}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Ilk PLATFORM_ADMIN bootstrap'i (ikisi de bos ise hicbir sey yapilmaz) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- CORS: frontend/ (Vite dev sunucusu) icin, birden fazla origin virgulle ayrilir ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- API dokumantasyonu ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true

management.endpoints.web.exposure.include=health,info
